<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuel Matsinhe - Brave New World</title>

    <!-- SEO & Metadata -->
    <meta name="description"
        content="Portfolio of Manuel Matsinhe - Software Engineer, Data Scientist, and Cybersecurity Enthusiast.">
    <meta property="og:title" content="Manuel Matsinhe - Brave New World">
    <meta property="og:description"
        content="Portfolio of Manuel Matsinhe - Software Engineer, Data Scientist, and Cybersecurity Enthusiast.">
    <meta property="og:image" content="assets/mm_logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="assets/mm_logo.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/mm_logo.png">

    <script>
        if (sessionStorage.getItem('enteredPortfolio')) {
            window.location.replace('main.html');
        }
    </script>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <div class="welcome-section">
            <h1 class="welcome-text">Welcome</h1>
            <p class="access-id-text">your portfolio access id: <span id="accessId"></span></p>
        </div>

        <div class="card-section">
            <div class="card-container" onclick="flipCard()">
                <div class="card" id="portfolioCard">

                    <div class="card-face card-front">
                        <div class="card-main">
                            <div class="card-header">
                                <div class="logo">MM.</div>
                                <div class="title-container">
                                    <div class="title-main">PORTFOLIO</div>
                                    <div class="title-sub">CARD</div>
                                </div>
                            </div>

                            <div class="card-body">
                                <div class="photo-frame">
                                    <img src="assets/profile_card.jpg" alt="Manuel Matsinhe">
                                </div>

                                <div class="info-section">
                                    <div class="name">MANUEL MATSINHE</div>
                                    <div class="id-number">ID NO: <span id="randomId"></span></div>

                                    <hr class="divider">

                                    <div class="details-grid">
                                        <span class="detail-label">VALID THRU:</span>
                                        <span class="detail-value">12/28</span>

                                        <span class="detail-label">MEMBER SINCE:</span>
                                        <span class="detail-value">2025</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer">
                            <div class="footer-text"><strong>portfólio</strong> card</div>
                        </div>
                    </div>

                    <div class="card-face card-back">
                        <a href="main.html" class="btn-portfolio"
                            onclick="event.stopPropagation(); return enterPortfolio(event);">Enter
                            Portfolio Website</a>
                    </div>
                </div>
            </div>

            <p class="click-text">click card</p>
        </div>

    </div>

    <!-- Verification Loading Screen -->
    <div id="verification-screen" class="verification-screen">
        <div class="verification-content">
            <img src="assets/mm_logo.png" alt="Logo" class="verification-logo">
            <div class="verification-text">Verifying access id...</div>
            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
